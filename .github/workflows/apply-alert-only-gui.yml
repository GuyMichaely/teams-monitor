name: Apply alert-only GUI changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-alert-only-gui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python scripts/apply-alert-only-gui.py

      - name: Commit changes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-alert-only-gui.yml scripts/apply-alert-only-gui.py
          git add config/config.json src/brain.mjs src/orchestrator.mjs src/gui-server-runtime.mjs AGENTS.md
          git commit -m "Add alert-only mode and cohesive runtime controls"
          git push origin HEAD:main
