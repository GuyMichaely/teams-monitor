name: Polish observability UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/polish-observability-ui.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply UI polish
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/gui-observability-ui.mjs")
          s = p.read_text()
          old = '''function obsActionClass(action) {
            const a = String(action || "").toLowerCase();
            return "action-" + (["alarm","escalate","respond","sent","hold","ignore","ignored","error"].includes(a) ? a : "ignore");
          }'''
          new = '''function obsActionClass(action) {
            const a = String(action || "").toLowerCase();
            if (["alarm","escalate","phone_alert","phone_alert_backstop","escalation_log"].includes(a)) return "action-alarm";
            if (["respond","sent","teams_reply"].includes(a)) return "action-respond";
            if (["hold","hold_message"].includes(a)) return "action-hold";
            if (a === "error") return "action-error";
            return "action-ignore";
          }'''
          if old not in s:
              raise SystemExit("action color mapping target not found")
          s = s.replace(old, new, 1)
          old = '''      else if (latestWs.kind === "ws_rejected") { wsText = "WebSocket: rejected"; wsClass = "bad"; }
                else { wsText = "WebSocket: " + latestWs.kind.replace(/^ws_/, ""); }'''
          new = '''      else if (latestWs.kind === "ws_rejected") { wsText = "WebSocket: rejected"; wsClass = "bad"; }
                else if (/error/.test(latestWs.kind)) { wsText = "WebSocket: " + latestWs.kind.replace(/^ws_/, ""); wsClass = "bad"; }
                else { wsText = "WebSocket: " + latestWs.kind.replace(/^ws_/, ""); }'''
          if old not in s:
              raise SystemExit("websocket summary target not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("src/gui-server-core.mjs")
          s = p.read_text()
          old = '  main { max-width:900px; margin:0 auto; padding:16px; }'
          new = '  main { max-width:1180px; margin:0 auto; padding:16px; }'
          if old not in s:
              raise SystemExit("dashboard width target not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("README.md")
          s = p.read_text()
          old = '''## GUI diagnostics

          The dashboard has **Connection diagnostics** with Refresh/Copy controls. It records WebSocket connection/rejection/disconnection events and includes redacted Cloudflare tunnel logs. `access_token`/`GUI_TOKEN` values are not intentionally exposed by the diagnostics API.
'''
          new = '''## GUI observability

          The dashboard's **Message pipeline** groups each processed Teams message into a single flow: message pickup, exact brain input, raw brain text output, parsed/color-coded decision, and resulting side effects such as phone alerts or Teams sends. Each flow has a stable `flowId`, and model input/output can be expanded without cluttering the main timeline.

          **Connection diagnostics** is a 2-second live tail (with Pause/Refresh/Copy controls) for WebSocket, FCM-registration, alert-ingress, and tunnel-control events. Raw redacted Cloudflare tunnel logs remain available in an expandable block. `access_token`/`GUI_TOKEN` values are not intentionally exposed by the diagnostics API.
'''
          if old not in s:
              raise SystemExit("README diagnostics target not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate UI
        run: |
          bun -e 'await import("./src/gui-observability-ui.mjs")'
          bun scripts/smoke-gui.mjs
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-observability-ui.yml
          git add src/gui-observability-ui.mjs src/gui-server-core.mjs README.md
          git commit -m "Polish observability timeline UI"
          git push origin HEAD:main
