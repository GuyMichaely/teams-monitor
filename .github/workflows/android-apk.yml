name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "scripts/setup-android-signing.ps1"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: android-app
        shell: bash
        run: |
          chmod +x gradlew
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode="$version_code" \
            -PappVersionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK publishing is waiting for signing secrets. Run scripts/setup-android-signing.ps1 once from your Windows machine."
          fi

      - name: Sign APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teams-monitor-release.jks"
          unsigned="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="$RUNNER_TEMP/teams-monitor.apk"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/teams-monitor-release.jks" \
            --ks-key-alias teamsmonitor \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify --verbose "$signed"

      - name: Upload workflow artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teams-monitor-apk
          path: ${{ runner.temp }}/teams-monitor.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="$RUNNER_TEMP/teams-monitor.apk"
          tag="android-latest"
          title="Latest Android build"
          notes="Automated sideload build from ${GITHUB_SHA}. Download teams-monitor.apk on the phone and install it over the existing app."

          if gh release view "$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force
            gh release edit "$tag" --title "$title" --notes "$notes"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
