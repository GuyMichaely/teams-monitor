name: Apply FCM transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fcm-transport.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes
        run: python scripts/apply-fcm-transport.py

      - name: Commit changes and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fcm-transport.yml scripts/apply-fcm-transport.py
          git add .gitignore AGENTS.md config/config.json src android-app .github/workflows/android-apk.yml
          git commit -m "Add Firebase Cloud Messaging transport"
          git push origin HEAD:main
