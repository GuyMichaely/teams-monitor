name: Apply Firebase project ID resolver

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fcm-projectid.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Firebase project ID resolver
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          Path("src/fcm-config.mjs").write_text(textwrap.dedent(r'''
          import { readFile } from "node:fs/promises";
          import { dirname, isAbsolute, join } from "node:path";
          import { fileURLToPath } from "node:url";

          const ROOT = join(dirname(fileURLToPath(import.meta.url)), "..");
          export const DEFAULT_FCM_SERVICE_ACCOUNT_FILE = "config/fcm-service-account.json";

          export async function resolveFcmConfig(fcm = {}) {
            const serviceAccountFile = String(
              fcm.serviceAccountFile || DEFAULT_FCM_SERVICE_ACCOUNT_FILE
            ).trim() || DEFAULT_FCM_SERVICE_ACCOUNT_FILE;
            const serviceAccountPath = isAbsolute(serviceAccountFile)
              ? serviceAccountFile
              : join(ROOT, serviceAccountFile);

            let serviceAccount = null;
            let serviceAccountPresent = false;
            let serviceAccountError = null;
            try {
              const raw = await readFile(serviceAccountPath, "utf8");
              serviceAccountPresent = true;
              serviceAccount = JSON.parse(raw);
            } catch (error) {
              serviceAccountPresent = error?.code !== "ENOENT";
              serviceAccountError = error;
            }

            const projectIdOverride = String(fcm.projectId || "").trim();
            const serviceAccountProjectId = String(serviceAccount?.project_id || "").trim();
            const projectId = projectIdOverride || serviceAccountProjectId;
            const projectIdSource = projectIdOverride
              ? "override"
              : serviceAccountProjectId
                ? "service-account"
                : "missing";

            return {
              projectId,
              projectIdSource,
              projectIdOverride,
              serviceAccountProjectId,
              serviceAccountFile,
              serviceAccountPath,
              serviceAccount,
              serviceAccountPresent,
              serviceAccountValid: !!serviceAccount,
              serviceAccountError,
            };
          }
          ''').lstrip())

          alerts = Path("src/alerts.mjs")
          text = alerts.read_text()
          if 'from "./fcm-config.mjs"' not in text:
            text = text.replace(
              'import { DATA_DIR } from "./state.mjs";\n',
              'import { DATA_DIR } from "./state.mjs";\nimport { resolveFcmConfig } from "./fcm-config.mjs";\n',
              1,
            )
          replacement = textwrap.dedent(r'''
          async function sendViaFcm(body, fcm) {
            const resolved = await resolveFcmConfig(fcm);
            if (!resolved.serviceAccountValid) {
              const detail = resolved.serviceAccountPresent ? "invalid service account JSON" : "service account file missing";
              throw new Error(`alerts.fcm not configured — ${detail}: ${resolved.serviceAccountFile}`);
            }
            if (!resolved.projectId) {
              throw new Error("alerts.fcm not configured — project ID missing from both config override and service account");
            }
            let deviceToken = "";
            try { deviceToken = (await readFile(FCM_DEVICE_TOKEN_FILE, "utf8")).trim(); } catch { /* not registered yet */ }
            if (!deviceToken) {
              throw new Error("FCM device token not registered — open the Android app while the GUI/tunnel is reachable");
            }
            const sa = resolved.serviceAccount;
            const accessToken = await fcmAccessToken(sa);
            const r = await fetch(`https://fcm.googleapis.com/v1/projects/${encodeURIComponent(resolved.projectId)}/messages:send`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${accessToken}` },
              body: JSON.stringify({
                message: {
                  token: deviceToken,
                  data: { chat: body.chat, author: body.author, text: body.text, time: body.time || "" },
                  android: { priority: "HIGH" },
                },
              }),
            });
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(`FCM send failed: ${r.status} ${j.error?.message || JSON.stringify(j)}`);
            return { transport: "fcm", messageId: j.name || null };
          }
          ''').lstrip()
          text, count = re.subn(r'async function sendViaFcm\(body, fcm\) \{[\s\S]*?\n\}', replacement.rstrip(), text, count=1)
          if count != 1:
            raise SystemExit("sendViaFcm replacement failed")
          alerts.write_text(text)

          gui = Path("src/gui-server-runtime.mjs")
          text = gui.read_text()
          if 'from "./fcm-config.mjs"' not in text:
            text = text.replace(
              'import { DATA_DIR } from "./state.mjs";\n',
              'import { DATA_DIR } from "./state.mjs";\nimport { DEFAULT_FCM_SERVICE_ACCOUNT_FILE, resolveFcmConfig } from "./fcm-config.mjs";\n',
              1,
            )

          runtime = textwrap.dedent(r'''
          async function runtimeConfig() {
            const cfg = JSON.parse(await readFile(CONFIG_FILE, "utf8"));
            const fcm = cfg.alerts?.fcm || {};
            const resolvedFcm = await resolveFcmConfig(fcm);
            let fcmTokenRegistered = false;
            try { fcmTokenRegistered = !!(await readFile(FCM_DEVICE_TOKEN_FILE, "utf8")).trim(); } catch { /* no token */ }
            return {
              pollIntervalMs: cfg.pollIntervalMs || 15000,
              mode: cfg.automation?.mode || "respond",
              alerts: {
                transport: cfg.alerts?.transport || "websocket",
                fcmProjectId: resolvedFcm.projectId,
                fcmProjectIdOverride: resolvedFcm.projectIdOverride,
                fcmProjectIdSource: resolvedFcm.projectIdSource,
                fcmTokenRegistered,
                fcmServiceAccountPresent: resolvedFcm.serviceAccountPresent,
                fcmServiceAccountValid: resolvedFcm.serviceAccountValid,
              },
            };
          }
          ''').lstrip()
          text, count = re.subn(
            r'async function runtimeConfig\(\) \{[\s\S]*?\n\}\n\n(?=async function saveAlertConfig)',
            runtime.rstrip() + "\n\n",
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit("runtimeConfig replacement failed")

          save = textwrap.dedent(r'''
          async function saveAlertConfig(req) {
            const body = await readJsonBody(req);
            const transport = String(body.transport || "");
            const projectId = String(body.projectId || "").trim();
            if (!["websocket", "fcm"].includes(transport)) {
              throw Object.assign(new Error("transport must be websocket or fcm"), { httpCode: 400 });
            }
            if (projectId.length > 128) {
              throw Object.assign(new Error("Firebase project ID is too long"), { httpCode: 400 });
            }
            const cfg = JSON.parse(await readFile(CONFIG_FILE, "utf8"));
            cfg.alerts = cfg.alerts || {};
            const nextFcm = {
              ...(cfg.alerts.fcm || {}),
              projectId,
              serviceAccountFile: cfg.alerts.fcm?.serviceAccountFile || DEFAULT_FCM_SERVICE_ACCOUNT_FILE,
            };
            const resolvedFcm = await resolveFcmConfig(nextFcm);
            if (transport === "fcm" && !resolvedFcm.projectId) {
              throw Object.assign(
                new Error("Firebase project ID missing from both override and service account"),
                { httpCode: 400 }
              );
            }
            cfg.alerts.transport = transport;
            cfg.alerts.fcm = nextFcm;
            delete cfg.alerts.fcm.deviceToken;
            await writeFile(CONFIG_FILE, JSON.stringify(cfg, null, 2) + "\n");
            return await runtimeConfig();
          }
          ''').lstrip()
          text, count = re.subn(
            r'async function saveAlertConfig\(req\) \{[\s\S]*?\n\}\n\n(?=async function registerFcmToken)',
            save.rstrip() + "\n\n",
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit("saveAlertConfig replacement failed")

          text = text.replace(
            'placeholder="Firebase project ID"',
            'placeholder="Optional Firebase project ID override"',
            1,
          )

          project_status = textwrap.dedent(r'''
            const project = document.getElementById("fcmProjectId");
            if (project && document.activeElement !== project) {
              project.value = c.alerts?.fcmProjectIdOverride || "";
              project.placeholder = c.alerts?.fcmProjectIdSource === "service-account"
                ? "Auto: " + c.alerts.fcmProjectId
                : "Optional Firebase project ID override";
            }
            const status = document.getElementById("fcmStatus");
            if (status) {
              const projectStatus = !c.alerts?.fcmProjectId
                ? "project ID missing"
                : c.alerts?.fcmProjectIdSource === "override"
                  ? "project ID ✓ (override)"
                  : "project ID ✓ (service account)";
              const serviceAccountStatus = c.alerts?.fcmServiceAccountValid
                ? "service account ✓"
                : c.alerts?.fcmServiceAccountPresent
                  ? "service account invalid"
                  : "service account missing";
              const parts = [
                projectStatus,
                serviceAccountStatus,
                c.alerts?.fcmTokenRegistered ? "phone token ✓" : "phone token missing",
              ];
              status.textContent = parts.join(" · ");
            }
            renderAlertTransportFields();
          ''').rstrip()
          text, count = re.subn(
            r'  const project = document\.getElementById\("fcmProjectId"\);[\s\S]*?  renderAlertTransportFields\(\);',
            project_status,
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit("GUI project status replacement failed")
          gui.write_text(text)

      - name: Commit change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fcm-projectid.yml
          git add src/fcm-config.mjs src/alerts.mjs src/gui-server-runtime.mjs
          git commit -m "Derive Firebase project ID from service account"
          git push origin HEAD:main
