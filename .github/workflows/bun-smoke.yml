# Covers the GUI runtime APIs used by both phone notification transports.
name: Bun runtime smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/smoke-gui.mjs"
      - "scripts/smoke-alert-state.mjs"
      - "scripts/smoke-health.mjs"
      - "scripts/start-stack.ps1"
      - "package.json"
      - ".github/workflows/bun-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/smoke-gui.mjs"
      - "scripts/smoke-alert-state.mjs"
      - "scripts/smoke-health.mjs"
      - "scripts/start-stack.ps1"
      - "package.json"
      - ".github/workflows/bun-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Show Bun version
        run: bun --version

      - name: Test alert delivery state machine
        run: bun scripts/smoke-alert-state.mjs

      - name: Test health monitoring transitions
        run: bun scripts/smoke-health.mjs

      - name: Test Bun child process and GUI WebSocket
        run: bun scripts/smoke-gui.mjs
