name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

env:
  ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
  FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK publishing is waiting for repository secret ANDROID_DEBUG_KEYSTORE_BASE64. Base64-encode your existing ~/.android/debug.keystore and add it under Settings > Secrets and variables > Actions."
          fi

      - name: Restore debug signing key
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Restore Firebase Android config
        if: env.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-app/app/google-services.json

      - name: Firebase configuration notice
        if: env.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 == ''
        run: echo "::notice::FCM is not embedded in this APK yet. Add FIREBASE_GOOGLE_SERVICES_JSON_BASE64 under repository Actions secrets, then rerun this workflow."

      - name: Build debug APK
        working-directory: android-app
        shell: bash
        run: |
          chmod +x gradlew
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode="$version_code" \
            -PappVersionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Prepare published APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "$RUNNER_TEMP/teams-monitor.apk"

      - name: Upload workflow artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teams-monitor-apk
          path: ${{ runner.temp }}/teams-monitor.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="$RUNNER_TEMP/teams-monitor.apk"
          tag="android-latest"
          version_name="1.0.${GITHUB_RUN_NUMBER}"
          title="Latest Android build (${version_name})"
          notes="Automated debug build ${version_name} from ${GITHUB_SHA}, signed with the same debug key used by local builds on the development PC. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Download teams-monitor.apk on the phone and install it over the existing app."

          if gh release view "$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$title" \
              --notes "$notes"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$title" \
              --notes "$notes"
          fi

          release_target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
          if [[ "$release_target" != "$GITHUB_SHA" ]]; then
            echo "::error::Release target is $release_target; expected $GITHUB_SHA"
            exit 1
          fi

          remote_tag="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          if [[ "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "::error::Remote tag is $remote_tag; expected $GITHUB_SHA"
            exit 1
          fi

          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'teams-monitor.apk'; then
            echo "::error::Release is missing teams-monitor.apk"
            exit 1
          fi
