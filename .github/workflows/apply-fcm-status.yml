name: Apply FCM status patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fcm-status.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update FCM prerequisite status
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/gui-server-runtime.mjs")
          text = path.read_text()
          needle = 'c.alerts?.fcmServiceAccountPresent ? "service account ✓" : "service account missing",'
          replacement = (
              'c.alerts?.fcmProjectId ? "project ID ✓" : "project ID missing",\n'
              '      ' + needle
          )
          if needle not in text:
              raise SystemExit("target line not found")
          path.write_text(text.replace(needle, replacement, 1))

      - name: Commit change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fcm-status.yml
          git add src/gui-server-runtime.mjs
          git commit -m "Show Firebase project ID status in GUI"
          git push origin HEAD:main
