name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "scripts/setup-android-signing.ps1"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK publishing is waiting for your existing Android debug keystore. Run scripts/setup-android-signing.ps1 once from your Windows machine."
          fi

      - name: Restore debug signing key
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android-app
        shell: bash
        run: |
          chmod +x gradlew
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode="$version_code" \
            -PappVersionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Prepare published APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "$RUNNER_TEMP/teams-monitor.apk"

      - name: Upload workflow artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teams-monitor-apk
          path: ${{ runner.temp }}/teams-monitor.apk
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk="$RUNNER_TEMP/teams-monitor.apk"
          tag="android-latest"
          title="Latest Android build"
          notes="Automated debug build from ${GITHUB_SHA}, signed with the same debug key used by local builds on the development PC. Download teams-monitor.apk on the phone and install it over the existing app."

          if gh release view "$tag" >/dev/null 2>&1; then
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force
            gh release edit "$tag" --title "$title" --notes "$notes"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
