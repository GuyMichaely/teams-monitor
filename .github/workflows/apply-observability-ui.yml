name: Apply observability UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-observability-ui.yml"
      - "scripts/patch-observability.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Apply observability patch
        run: |
          python scripts/patch-observability.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/gui-observability-ui.mjs")
          s = p.read_text()
          s = s.replace('detail ? "\\n" : ""', 'detail ? "\\\\n" : ""')
          p.write_text(s)
          PY

      - name: Validate server and browser UI
        run: |
          bun -e 'await import("./src/brain.mjs"); await import("./src/orchestrator.mjs"); await import("./src/gui-observability-ui.mjs")'
          bun scripts/smoke-gui.mjs

      - name: Commit observability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-observability-ui.yml scripts/patch-observability.py .github/workflows/debug-observability-ui.yml
          git add src/brain.mjs src/orchestrator.mjs src/gui-server-core.mjs src/gui-server.mjs src/gui-observability-ui.mjs scripts/smoke-gui.mjs
          git commit -m "Add live orchestrator pipeline timeline"
          git push origin HEAD:main
