name: Remove FCM project ID override

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-fcm-projectid-override.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        shell: python
        run: |
          from pathlib import Path
          import json

          fcm = Path("src/fcm-config.mjs")
          text = fcm.read_text()
          start = text.index('  const projectIdOverride = String(fcm.projectId || "").trim();')
          end = text.index('    serviceAccountFile,', start)
          text = text[:start] + '  const projectId = String(serviceAccount?.project_id || "").trim();\n\n  return {\n    projectId,\n' + text[end:]
          fcm.write_text(text)

          gui = Path("src/gui-server-runtime.mjs")
          text = gui.read_text()
          text = text.replace('      fcmProjectId: resolvedFcm.projectId,\n      fcmProjectIdOverride: resolvedFcm.projectIdOverride,\n      fcmProjectIdSource: resolvedFcm.projectIdSource,\n', '      fcmProjectId: resolvedFcm.projectId,\n', 1)

          start = text.index('async function saveAlertConfig(req) {')
          end = text.index('\nasync function registerFcmToken(req) {', start)
          replacement = '''async function saveAlertConfig(req) {
            const body = await readJsonBody(req);
            const transport = String(body.transport || "");
            if (!["websocket", "fcm"].includes(transport)) {
              throw Object.assign(new Error("transport must be websocket or fcm"), { httpCode: 400 });
            }
            const cfg = JSON.parse(await readFile(CONFIG_FILE, "utf8"));
            cfg.alerts = cfg.alerts || {};
            const nextFcm = {
              ...(cfg.alerts.fcm || {}),
              serviceAccountFile: cfg.alerts.fcm?.serviceAccountFile || DEFAULT_FCM_SERVICE_ACCOUNT_FILE,
            };
            delete nextFcm.projectId;
            const resolvedFcm = await resolveFcmConfig(nextFcm);
            if (transport === "fcm" && !resolvedFcm.projectId) {
              throw Object.assign(new Error("Firebase project ID missing from service account"), { httpCode: 400 });
            }
            cfg.alerts.transport = transport;
            cfg.alerts.fcm = nextFcm;
            delete cfg.alerts.fcm.deviceToken;
            await writeFile(CONFIG_FILE, JSON.stringify(cfg, null, 2) + "\\n");
            return await runtimeConfig();
          }
          '''
          text = text[:start] + replacement + text[end:]

          start = text.index('      <div id="fcmFields" style="margin-top:10px">')
          end = text.index('      </div>\n    </div>\n\n    <p style=', start) + len('      </div>')
          text = text[:start] + '      <div id="fcmFields" style="margin-top:10px">\n        <span id="fcmStatus" style="color:var(--dim);font-size:12px"></span>\n      </div>' + text[end:]

          start = text.index('const project = document.getElementById("fcmProjectId");')
          end = text.index('\nrenderAlertTransportFields();', start)
          status = '''const status = document.getElementById("fcmStatus");
          if (status) {
            const projectStatus = c.alerts?.fcmProjectId ? "project ID ✓ (service account)" : "project ID missing";
            const serviceAccountStatus = c.alerts?.fcmServiceAccountValid
              ? "service account ✓"
              : c.alerts?.fcmServiceAccountPresent
                ? "service account invalid"
                : "service account missing";
            status.textContent = [
              projectStatus,
              serviceAccountStatus,
              c.alerts?.fcmTokenRegistered ? "phone token ✓" : "phone token missing",
            ].join(" · ");
          }'''
          text = text[:start] + status + text[end:]

          text = text.replace('  const projectId = document.getElementById("fcmProjectId").value.trim();\n', '', 1)
          text = text.replace('body: JSON.stringify({ transport, projectId }),', 'body: JSON.stringify({ transport }),', 1)
          gui.write_text(text)

          cfg_path = Path("config/config.json")
          cfg = json.loads(cfg_path.read_text())
          cfg.setdefault("alerts", {}).setdefault("fcm", {}).pop("projectId", None)
          cfg_path.write_text(json.dumps(cfg, indent=2, ensure_ascii=True) + "\n")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-fcm-projectid-override.yml
          git add src/fcm-config.mjs src/gui-server-runtime.mjs config/config.json
          git commit -m "Use Firebase service account project ID only"
          git push origin HEAD:main
