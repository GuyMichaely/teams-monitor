name: Temporary main smoke validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-main-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Alert delivery state
        run: bun scripts/smoke-alert-state.mjs
      - name: Health monitoring
        run: bun scripts/smoke-health.mjs
      - name: GUI runtime
        run: bun scripts/smoke-gui.mjs
